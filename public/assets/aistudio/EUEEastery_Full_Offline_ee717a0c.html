<script>
"use strict";
/* ===== 1. PURE LOGIC (no DOM; unit-testable) ===== */
/*PURE-START*/
const day=864e5,now=()=>Date.now();
const norm=s=>String(s??"").toLowerCase().normalize("NFKC").replace(/[.,;:!?()[\]{}]/g," ").replace(/\s+/g," ").trim();
const hash=s=>{let x=2166136261;for(const c of s){x^=c.codePointAt(0);x=Math.imul(x,16777619)}return(x>>>0).toString(36)};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const csvCell=v=>{v=String(v??"");if(/^[=+@]|^-[^\d.]/.test(v))v="'"+v;return/[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=rows=>rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
/* Question schema: prompt, answers[] (required); id, options[], topic, difficulty, hints[], tags[], references[],
   explanation, whyCorrect, commonMistakes, concept, workedExample, memoryTip, examTrap (optional).
   Accepted variants: question|q -> prompt; answer|a -> answers; why -> explanation; tip -> memoryTip; choices -> options. */
const TEXTS=[["explanation","why"],["whyCorrect"],["commonMistakes"],["concept"],["workedExample"],["memoryTip","tip"],["examTrap"]],LISTS=["hints","tags","references"];
function nq(r){
 if(!r||typeof r!=="object"||Array.isArray(r))throw "Record is not a JSON object";
 const pick=(...k)=>{for(const x of k)if(r[x]!=null&&r[x]!=="")return r[x]};
 const list=v=>(Array.isArray(v)?v:v==null?[]:[v]).map(x=>String(x).trim()).filter(Boolean);
 const prompt=String(pick("prompt","question","q")??"").trim();
 if(!prompt)throw "Missing question text (prompt, question or q)";
 const answers=[...new Set(list(pick("answers","answer","a")))];
 if(!answers.length)throw "Missing answer (answers, answer or a)";
 const o={id:String(pick("id")??"").trim()||"q_"+hash(norm(prompt)),prompt,answers,
  options:[...new Set(list(pick("options","choices")))].slice(0,20),
  topic:String(pick("topic")??"").trim()||"General",difficulty:String(pick("difficulty")??"").trim().toLowerCase()};["type","unit","img"].forEach(k=>{const v=pick(k);if(v!=null)o[k]=String(v).trim()});if(pick("tol")!=null&&!isNaN(+pick("tol")))o.tol=+pick("tol");
 TEXTS.forEach(k=>{const v=pick(...k);if(v!=null)o[k[0]]=String(v)});
 LISTS.forEach(k=>{const v=list(r[k]);if(v.length)o[k]=v});
 return o}
function analyze(text){
 let d;try{d=JSON.parse(text)}catch(e){return{err:"Invalid JSON: "+e.message}}
 if(d&&!Array.isArray(d)&&Array.isArray(d.questions))d=d.questions;
 if(!Array.isArray(d))return{err:'Expected an array of question objects (or {"questions":[...]}).'};
 if(!d.length)return{err:"The JSON contains no questions."};
 if(d.length>5000)return{err:"Too many questions ("+d.length+"). The limit is 5,000 per import."};
 const ok=[],rej=[],ids=new Set(),txt=new Set();
 d.forEach((r,i)=>{try{const q=nq(r),t=norm(q.prompt);
  if(txt.has(t))throw "Duplicate question text inside the file";
  if(ids.has(q.id))throw "Duplicate ID inside the file: "+q.id;
  ids.add(q.id);txt.add(t);ok.push(q)}catch(e){rej.push({n:i+1,e:String(e&&e.message||e)})}});
 return{ok,rej,total:d.length}}
function plan(ok,cur){
 const byId=new Map(cur.map(q=>[q.id,q])),byTxt=new Map(cur.map(q=>[norm(q.prompt),q])),p={add:[],rep:[],skip:[]};
 ok.forEach(q=>{const a=byId.get(q.id),b=byTxt.get(norm(q.prompt));
  if(a){if(norm(a.prompt)!==norm(q.prompt))p.skip.push({q,why:"ID "+q.id+" is already used by a different question"});
   else if(JSON.stringify(a)===JSON.stringify(q))p.skip.push({q,why:"Identical question already in the bank"});else p.rep.push(q)}
  else if(b)p.skip.push({q,why:"Same question text as "+b.id});else p.add.push(q)});
 return p}
/* Scheduler (Leitner boxes): box 0..5 -> next review after 10 min, 1, 3, 7, 14, 30 days.
   Wrong answer: back to box 0. Correct AND confidence >= 2 AND the item was due: up one box.
   Correct but unsure, or extra practice before it is due: box unchanged (no cramming credit). */
const INT=[.007,1,3,7,14,30];
function srsNext(r,ok,conf,t){t=t||now();r=r||{box:0,due:0};
 if(!ok){r.box=0;r.due=t+INT[0]*day}
 else if(r.due<=t){if(conf>=2)r.box=Math.min(5,r.box+1);r.due=t+INT[r.box]*day}
 return r}
/* Mastered = box>=4, 3+ correct answers, latest answer correct and not "unsure". Never from one correct answer. */
const mastered=(p,r)=>!!p&&!!r&&r.box>=4&&p.ok>=3&&p.lo===1&&p.conf>=2;
const nf_=s=>{const m=String(s).replace(/,/g,"").match(/^\s*([-+]?\d*\.?\d+(?:e[-+]?\d+)?)/i);return m?parseFloat(m[1]):NaN};
const okOf=(q,v)=>{const n=norm(v);if(!n)return false;
 if(q.type==="number"){const x=nf_(v);return !isNaN(x)&&q.answers.some(a=>{const y=nf_(a);return !isNaN(y)&&Math.abs(x-y)<=Math.abs(y)*(q.tol!=null?q.tol:.01)+1e-9})}
 if(q.type==="formula"||(!q.type&&/\b(symbol|formula)\b/i.test(q.prompt)&&q.answers.every(a=>/^[A-Z(\[][A-Za-z0-9₀-₉()⁺⁻²³⁴+\-\[\]]*$/.test(a)))){const t=String(v).normalize("NFKC").replace(/\s+/g,"");return q.answers.some(x=>String(x).normalize("NFKC").replace(/\s+/g,"")===t)}
 return q.answers.some(x=>norm(x)===n)};
function buildOpts(q,pool){
 const acc=new Set(q.answers.map(norm)),seen=new Set(acc),wrong=[];
 const right=q.options.find(o=>acc.has(norm(o)))||q.answers[0];seen.add(norm(right));
 const add=o=>{const n=norm(o);if(n&&!seen.has(n)){seen.add(n);wrong.push(o)}};
 q.options.forEach(add);
 shuffle(pool.filter(x=>x.id!==q.id&&x.topic===q.topic)).forEach(x=>add(x.answers[0]));
 shuffle(pool.filter(x=>x.id!==q.id)).forEach(x=>add(x.answers[0]));
 return shuffle([right,...wrong.slice(0,3)])}
const exp=q=>q.answers[0]+(q.answers.length>1?" (also accepted: "+q.answers.slice(1,4).join(", ")+(q.answers.length>4?", …":"")+")":"");
/*PURE-END*/

/* ===== 2. DOM HELPERS (imported text is only ever added as text nodes) ===== */
